<!DOCTYPE html>
<html>
<head>
    <title>MedTriage Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>🩺 MedTriage Dashboard</h1>

    <!-- 🌙 BUTTON -->
    <button onclick="toggleDark()">🌙 Toggle Dark</button>

    <!-- FORM -->
    <div class="card">
        <h2>Patient Input</h2>
        <form id="form">
            <input type="number" id="age" placeholder="Age" required>
            <input type="text" id="symptoms" placeholder="Symptoms" required>
            <button type="submit">Analyze</button>
        </form>
    </div>

    <!-- RESULT -->
    <div id="resultBox" class="card hidden">
        <h2>Result</h2>
        <p id="risk"></p>
        <p id="advice"></p>
    </div>

    <!-- CHART -->
    <div class="card">
        <h2>Patient Risk Distribution</h2>
        <canvas id="chart"></canvas>
    </div>

</div>

<script>
let chart;

/* ✅ ADD YOUR FUNCTION HERE */
function toggleDark() {
    document.body.classList.toggle("dark");
}

/* Chart loading */
async function loadChart() {
    const res = await fetch("/history");
    const data = await res.json();

    let counts = {HIGH:0, MEDIUM:0, LOW:0};

    data.forEach(d => counts[d.risk]++);

    const ctx = document.getElementById("chart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ["High", "Medium", "Low"],
            datasets: [{
                data: [counts.HIGH, counts.MEDIUM, counts.LOW],
                backgroundColor: ["red", "orange", "green"]
            }]
        }
    });
}

/* Form submit */
document.getElementById("form").onsubmit = async function(e) {
    e.preventDefault();

    const age = document.getElementById("age").value;
    const symptoms = document.getElementById("symptoms").value;

    const res = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({age, symptoms})
    });

    const data = await res.json();

    document.getElementById("risk").innerText = "Risk: " + data.risk_level;
    document.getElementById("advice").innerText = data.advice;

    document.getElementById("resultBox").classList.remove("hidden");

    loadChart();
};

/* Load chart initially */
loadChart();
</script>

</body>
</html>
