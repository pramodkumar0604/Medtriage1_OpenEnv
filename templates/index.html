<!DOCTYPE html>
<html>
<head>
    <title>MedTriage | Smart Healthcare</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>🩺 MedTriage</h1>
        <p>AI-powered Patient Risk Assessment System</p>
    </div>

    <div class="card">
        <h2>Patient Symptom Checker</h2>

        <form id="form">
            <input type="text" id="symptoms" placeholder="Enter symptoms (e.g. fever, cough, headache)">
            <button type="submit">Analyze</button>
        </form>

        <div id="resultBox" class="result hidden">
            <h3>Assessment Result</h3>
            <p id="resultText"></p>
        </div>
    </div>

    <div class="footer">
        <p>⚠️ This is a demo system. Consult a doctor for medical advice.</p>
    </div>

</div>

<script>
document.getElementById("form").onsubmit = async function(e) {
    e.preventDefault();

    const symptoms = document.getElementById("symptoms").value;

    const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symptoms })
    });

    const data = await res.json();

    const box = document.getElementById("resultBox");
    const text = document.getElementById("resultText");

    text.innerText = data.triage_result;
    box.classList.remove("hidden");

    // color based on severity
    if (data.triage_result.includes("⚠️")) {
        box.style.borderLeft = "6px solid red";
    } else if (data.triage_result.includes("🟡")) {
        box.style.borderLeft = "6px solid orange";
    } else {
        box.style.borderLeft = "6px solid green";
    }
};
</script>

</body>
</html>
